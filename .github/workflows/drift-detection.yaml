##
## Terraform Drift Detection — runs on a schedule and detects when live
## infrastructure has drifted from the Terraform state file.
##
## On drift detection:
##  1. Parses the plan output for unexpected changes
##  2. Creates a GitHub issue with the full diff
##  3. Posts a Slack alert with affected resources
##
## Design: read-only — runs `terraform plan` only, never applies.
##
name: Drift Detection

on:
  schedule:
    # Run at 06:00 UTC Mon-Fri (before business hours)
    - cron: '0 6 * * MON-FRI'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to check'
        required: true
        default: 'production'
        type: choice
        options: [production, staging]
      workspace:
        description: 'Terraform workspace'
        required: false
        default: 'default'

env:
  TF_VERSION: "1.7.5"
  AWS_REGION: us-east-1

jobs:
  # Gate: this workflow talks to live AWS via OIDC and needs a real state
  # backend, so it can only do meaningful work when cloud credentials are
  # configured. On a public/fork clone with no secrets there is nothing to
  # check, so we skip (a clean no-op) instead of failing with a red X.
  #
  # NOTE: the `secrets` context is not available in a job-level `if:`, so we
  # surface the secret's presence as a job output and gate downstream jobs on
  # it. This keeps the workflow green (detect-drift shows as *skipped*) when
  # AWS_TERRAFORM_ROLE_ARN is absent.
  check-credentials:
    name: Check for cloud credentials
    runs-on: ubuntu-latest
    outputs:
      has-creds: ${{ steps.check.outputs.has-creds }}
    steps:
      - id: check
        env:
          AWS_TERRAFORM_ROLE_ARN: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
        run: |
          MISSING=""
          [ -z "${AWS_TERRAFORM_ROLE_ARN}" ] && MISSING="${MISSING} AWS_TERRAFORM_ROLE_ARN"
          [ -z "${TF_STATE_BUCKET}" ] && MISSING="${MISSING} TF_STATE_BUCKET"

          if [ -z "${MISSING}" ]; then
            echo "has-creds=true" >> "$GITHUB_OUTPUT"
            echo "AWS credentials and state backend configured — drift detection will run."
          else
            echo "has-creds=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Missing secret(s):${MISSING} — skipping drift detection. This is expected on a public/fork clone with no cloud credentials."
          fi

  detect-drift:
    name: Detect drift in ${{ inputs.environment || 'production' }}
    needs: check-credentials
    if: needs.check-credentials.outputs.has-creds == 'true'
    runs-on: ubuntu-latest
    outputs:
      drift_detected: ${{ steps.plan.outputs.drift_detected }}
    permissions:
      id-token: write       # OIDC auth to AWS
      contents: read
      issues: write         # Create drift issues

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      # Drift is only meaningful against a platform that has actually been
      # applied. Until `terraform apply` has run once there is no state object,
      # so `plan` would report the entire stack as "to add" and open a bogus
      # drift issue on every scheduled run. Detect that and skip cleanly.
      - name: Check for existing Terraform state
        id: state
        env:
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
        run: |
          ENVIRONMENT="${{ inputs.environment || 'production' }}"
          WORKSPACE="${{ inputs.workspace || 'default' }}"
          KEY="${ENVIRONMENT}/platform/terraform.tfstate"

          # Non-default workspaces live under the env:/ prefix in the S3 backend.
          if [ "$WORKSPACE" != "default" ]; then
            KEY="env:/${WORKSPACE}/${KEY}"
          fi

          echo "state_key=${KEY}" >> "$GITHUB_OUTPUT"

          if aws s3api head-object --bucket "${TF_STATE_BUCKET}" --key "${KEY}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Found remote state at s3://${TF_STATE_BUCKET}/${KEY}"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No Terraform state at s3://${TF_STATE_BUCKET}/${KEY} — the ${ENVIRONMENT} platform has not been applied yet, so there is nothing to drift from. Skipping drift detection."
          fi

      - name: Terraform init
        if: steps.state.outputs.exists == 'true'
        working-directory: terraform/envs/${{ inputs.environment || 'production' }}
        env:
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
        run: |
          # The backend block is a partial config (see main.tf) so the bucket,
          # region and key are supplied here. The region MUST be the bucket's
          # real region: a mismatch makes S3 answer ListObjectsV2 with a 301
          # and init fails with "Failed to get existing workspaces".
          terraform init -input=false \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="key=${{ steps.state.outputs.state_key }}"

      - name: Select workspace
        if: steps.state.outputs.exists == 'true'
        working-directory: terraform/envs/${{ inputs.environment || 'production' }}
        run: |
          WORKSPACE="${{ inputs.workspace || 'default' }}"
          terraform workspace select "$WORKSPACE" || terraform workspace new "$WORKSPACE"

      - name: Run drift detection plan
        id: plan
        if: steps.state.outputs.exists == 'true'
        working-directory: terraform/envs/${{ inputs.environment || 'production' }}
        run: |
          set +e
          terraform plan \
            -detailed-exitcode \
            -input=false \
            -out=tfplan \
            -lock=false \
            2>&1 | tee plan-output.txt
          EXIT_CODE=${PIPESTATUS[0]}

          # Exit codes: 0=no changes, 1=error, 2=drift detected
          echo "exit_code=${EXIT_CODE}" >> "$GITHUB_OUTPUT"

          if [ "$EXIT_CODE" -eq 0 ]; then
            echo "drift_detected=false" >> "$GITHUB_OUTPUT"
            echo "No drift detected — infrastructure matches Terraform state."
          elif [ "$EXIT_CODE" -eq 2 ]; then
            echo "drift_detected=true" >> "$GITHUB_OUTPUT"
            echo "DRIFT DETECTED — infrastructure differs from Terraform state."

            # Count changed resources
            CHANGES=$(grep -c "^  # " plan-output.txt || true)
            echo "change_count=${CHANGES}" >> "$GITHUB_OUTPUT"
          else
            echo "drift_detected=error" >> "$GITHUB_OUTPUT"
            echo "::error::Terraform plan failed with exit code ${EXIT_CODE}"
          fi

      - name: Parse drift details
        if: steps.plan.outputs.drift_detected == 'true'
        id: parse
        working-directory: terraform/envs/${{ inputs.environment || 'production' }}
        run: |
          # Extract the list of drifted resources
          DRIFTED_RESOURCES=$(grep -E "^\s+# (aws_|module\.)" plan-output.txt \
            | sed 's/^[[:space:]]*# //' \
            | head -50 \
            | jq -R -s 'split("\n") | map(select(length > 0))' || echo '[]')

          echo "drifted_resources=${DRIFTED_RESOURCES}" >> "$GITHUB_OUTPUT"

          # Truncate plan output for GitHub issue (max 65536 chars)
          head -c 60000 plan-output.txt > plan-truncated.txt

      - name: Create GitHub issue for drift
        if: steps.plan.outputs.drift_detected == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ENVIRONMENT="${{ inputs.environment || 'production' }}"
          DATE=$(date -u +"%Y-%m-%d")
          PLAN_OUTPUT=$(cat terraform/envs/${ENVIRONMENT}/plan-truncated.txt)

          # Check if a drift issue already exists for today
          EXISTING=$(gh issue list \
            --label "drift,${ENVIRONMENT}" \
            --state open \
            --search "Terraform Drift Detected: ${ENVIRONMENT} ${DATE}" \
            --json number -q '.[0].number')

          if [ -n "$EXISTING" ]; then
            # Update existing issue with new run
            gh issue comment "$EXISTING" \
              --body "## Drift still present — re-check $(date -u +"%H:%M UTC")

          \`\`\`
          ${PLAN_OUTPUT}
          \`\`\`"
            echo "Updated existing drift issue #${EXISTING}"
          else
            # Create new drift issue
            gh issue create \
              --title "Terraform Drift Detected: ${ENVIRONMENT} ${DATE}" \
              --label "drift,${ENVIRONMENT},infrastructure" \
              --body "$(cat <<ISSUEEOF
          ## Infrastructure Drift Detected

          **Environment:** \`${ENVIRONMENT}\`
          **Detected at:** $(date -u +"%Y-%m-%dT%H:%M:%SZ")
          **Changed resources:** ${{ steps.plan.outputs.change_count }}
          **Workflow run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          ### Action Required

          Review the Terraform plan below to understand what changed outside of Terraform.
          Options:
          1. **Fix the drift**: Apply the Terraform plan to restore desired state
          2. **Accept the change**: Update Terraform configuration to match current state
          3. **Investigate**: Identify what/who made the out-of-band change

          ### Terraform Plan Output

          \`\`\`hcl
          ${PLAN_OUTPUT}
          \`\`\`

          ### How to Resolve

          \`\`\`bash
          cd terraform/envs/${ENVIRONMENT}
          terraform plan  # Review changes
          terraform apply # Apply to fix drift (requires approval)
          \`\`\`
          ISSUEEOF
          )"
            echo "Created drift issue"
          fi

      - name: Post Slack notification on drift
        if: steps.plan.outputs.drift_detected == 'true' && env.SLACK_WEBHOOK_URL != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          ENVIRONMENT="${{ inputs.environment || 'production' }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          curl -s -X POST "$SLACK_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{
              \"attachments\": [{
                \"color\": \"#ff9900\",
                \"blocks\": [
                  {
                    \"type\": \"header\",
                    \"text\": {\"type\": \"plain_text\", \"text\": \":warning: Terraform Drift Detected: ${ENVIRONMENT}\"}
                  },
                  {
                    \"type\": \"section\",
                    \"fields\": [
                      {\"type\": \"mrkdwn\", \"text\": \"*Environment*\n\`${ENVIRONMENT}\`\"},
                      {\"type\": \"mrkdwn\", \"text\": \"*Changed Resources*\n${{ steps.plan.outputs.change_count }}\"},
                      {\"type\": \"mrkdwn\", \"text\": \"*Detected*\n$(date -u +\"%Y-%m-%d %H:%M UTC\")\"}
                    ]
                  },
                  {
                    \"type\": \"actions\",
                    \"elements\": [
                      {
                        \"type\": \"button\",
                        \"text\": {\"type\": \"plain_text\", \"text\": \"View Workflow Run\"},
                        \"url\": \"${RUN_URL}\"
                      }
                    ]
                  }
                ]
              }]
            }"

      - name: Report not-yet-deployed
        if: steps.state.outputs.exists != 'true'
        run: |
          echo "The ${{ inputs.environment || 'production' }} platform has not been applied yet —"
          echo "no remote state at s3://***/${{ steps.state.outputs.state_key }}."
          echo "Drift detection will start reporting once \`terraform apply\` has run once."

      - name: Report clean state
        if: steps.plan.outputs.drift_detected == 'false'
        run: |
          echo "Infrastructure is in sync with Terraform state."
          echo "Environment: ${{ inputs.environment || 'production' }}"
          echo "Checked at: $(date -u)"

  close-resolved-issues:
    name: Close resolved drift issues
    needs: [check-credentials, detect-drift]
    runs-on: ubuntu-latest
    if: needs.check-credentials.outputs.has-creds == 'true' && needs.detect-drift.outputs.drift_detected == 'false'
    permissions:
      issues: write
    steps:
      - name: Close open drift issues for this environment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ENVIRONMENT="${{ inputs.environment || 'production' }}"
          OPEN_ISSUES=$(gh issue list \
            --label "drift,${ENVIRONMENT}" \
            --state open \
            --json number -q '.[].number')

          for issue in $OPEN_ISSUES; do
            gh issue close "$issue" \
              --comment "Drift resolved — infrastructure now matches Terraform state as of $(date -u). Closing automatically."
            echo "Closed drift issue #${issue}"
          done
