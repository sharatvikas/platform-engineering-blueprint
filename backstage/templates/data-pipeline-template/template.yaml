##
## Backstage Software Template: Data Pipeline
##
## Self-service scaffolding for a Python-based data pipeline service:
##   - Repository with pipeline skeleton (Airflow DAG or standalone batch job)
##   - S3 source and destination buckets via Crossplane claims
##   - Optional RDS output database
##   - Kubernetes CronJob or Deployment manifest
##   - GitHub Actions CI + Docker build
##   - Backstage catalog registration
##
apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: data-pipeline-template
  title: Data Pipeline
  description: >
    Scaffold a Python-based data pipeline with S3 storage, optional database output,
    and Kubernetes scheduling pre-configured.
  tags:
    - data
    - pipeline
    - python
    - airflow
    - kubernetes
spec:
  owner: platform-team
  type: service

  parameters:
    - title: Pipeline Details
      required: [name, owner, description, schedule]
      properties:
        name:
          title: Pipeline Name
          type: string
          description: Lowercase, hyphenated (e.g. daily-revenue-rollup)
          pattern: "^[a-z][a-z0-9-]{2,62}$"
          ui:autofocus: true
        owner:
          title: Owner Team
          type: string
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              kind: Group
        description:
          title: Description
          type: string
          description: What does this pipeline produce?
        schedule:
          title: Cron Schedule
          type: string
          description: Kubernetes CronJob schedule (e.g. "0 6 * * *" for daily at 06:00 UTC)
          default: "0 6 * * *"
        pipeline_type:
          title: Pipeline Type
          type: string
          enum: [cronjob, airflow-dag, streaming]
          enumNames: ["Kubernetes CronJob", "Airflow DAG", "Streaming (Kafka Consumer)"]
          default: cronjob

    - title: Storage
      properties:
        source_bucket:
          title: Source S3 Bucket
          type: string
          description: Existing bucket name (or leave blank to provision a new one)
        provision_output_bucket:
          title: Provision Output S3 Bucket
          type: boolean
          default: true
          description: Create a dedicated output bucket for this pipeline
        needs_database:
          title: Output to PostgreSQL
          type: boolean
          default: false
          description: Write pipeline output to an RDS database

    - title: Repository
      required: [repoUrl]
      properties:
        repoUrl:
          title: Repository Location
          type: string
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts: [github.com]
            allowedOrganizations: [sharatvikas]

  steps:
    - id: fetch-base
      name: Fetch Pipeline Skeleton
      action: fetch:template
      input:
        url: ./skeleton
        values:
          name: ${{ parameters.name }}
          owner: ${{ parameters.owner }}
          description: ${{ parameters.description }}
          schedule: ${{ parameters.schedule }}
          pipeline_type: ${{ parameters.pipeline_type }}
          source_bucket: ${{ parameters.source_bucket }}
          provision_output_bucket: ${{ parameters.provision_output_bucket }}
          needs_database: ${{ parameters.needs_database }}

    - id: publish
      name: Publish to GitHub
      action: publish:github
      input:
        allowedHosts: [github.com]
        description: ${{ parameters.description }}
        repoUrl: ${{ parameters.repoUrl }}
        defaultBranch: main
        gitCommitMessage: "chore: initial scaffold from IDP data pipeline template"
        repoVisibility: private

    - id: register-catalog
      name: Register in Backstage Catalog
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps.publish.output.repoContentsUrl }}
        catalogInfoPath: "/backstage/catalog-info.yaml"

  output:
    links:
      - title: Repository
        url: ${{ steps.publish.output.remoteUrl }}
      - title: Open in Backstage Catalog
        icon: catalog
        entityRef: ${{ steps.register-catalog.output.entityRef }}
