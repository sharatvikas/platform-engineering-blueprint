##
## Backstage Software Template: S3 Bucket
##
## Self-service provisioning of a Crossplane-managed S3 bucket.
## Engineers fill out a form; the template PRs an S3Bucket claim to the GitOps repo.
##
apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: s3-bucket-template
  title: S3 Bucket
  description: >
    Self-service provisioning of an S3 bucket with encryption, versioning,
    and lifecycle policies via Crossplane. Submits a PR to the GitOps repo.
  tags:
    - storage
    - aws
    - s3
    - crossplane
spec:
  owner: platform-team
  type: resource

  parameters:
    - title: Bucket Details
      required: [name, owner, purpose]
      properties:
        name:
          title: Bucket Name Suffix
          type: string
          description: Bucket will be named {env}-{name}. Must be globally unique.
          pattern: "^[a-z0-9-]{3,40}$"
          ui:autofocus: true
        owner:
          title: Owner Team
          type: string
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              kind: Group
        purpose:
          title: Purpose
          type: string
          description: What will this bucket store? (audit logs, ML datasets, backups, etc.)

    - title: Configuration
      required: [environment]
      properties:
        environment:
          title: Environment
          type: string
          enum: [production, staging, development]
          default: staging
        versioning:
          title: Versioning
          type: string
          enum: [Enabled, Suspended]
          default: Enabled
        encryption:
          title: Encryption
          type: string
          enum: [AES256, aws:kms]
          enumNames: ["SSE-S3 (AES-256)", "SSE-KMS (managed key)"]
          default: AES256
        lifecycle_enabled:
          title: Lifecycle Policies
          type: boolean
          default: true
          description: Enable IA transition (30d) and Glacier transition (90d)
        public_access_block:
          title: Block All Public Access
          type: boolean
          default: true

  steps:
    - id: fetch-claim
      name: Render S3 Claim
      action: fetch:template
      input:
        url: ./skeleton
        values:
          name: ${{ parameters.name }}
          owner: ${{ parameters.owner }}
          purpose: ${{ parameters.purpose }}
          environment: ${{ parameters.environment }}
          versioning: ${{ parameters.versioning }}
          encryption: ${{ parameters.encryption }}
          lifecycle_enabled: ${{ parameters.lifecycle_enabled }}
          public_access_block: ${{ parameters.public_access_block }}

    - id: open-pr
      name: Open GitOps Pull Request
      action: publish:github:pull-request
      input:
        repoUrl: github.com?repo=platform-engineering-blueprint&owner=sharatvikas
        title: "feat(s3): provision bucket ${{ parameters.environment }}-${{ parameters.name }}"
        description: |
          ## S3 Bucket Provision Request

          **Name:** ${{ parameters.environment }}-${{ parameters.name }}
          **Owner:** ${{ parameters.owner }}
          **Environment:** ${{ parameters.environment }}
          **Versioning:** ${{ parameters.versioning }}
          **Encryption:** ${{ parameters.encryption }}
          **Purpose:** ${{ parameters.purpose }}

          Auto-generated by Backstage self-service template.
        branchName: s3/${{ parameters.environment }}-${{ parameters.name }}
        sourcePath: ./
        targetPath: gitops/crossplane/claims/buckets

  output:
    links:
      - title: GitOps Pull Request
        url: ${{ steps.open-pr.output.remoteUrl }}
