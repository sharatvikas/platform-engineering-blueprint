##
## Crossplane S3Bucket claim — auto-generated by Backstage IDP
## Owner: ${{ values.owner }}
## Purpose: ${{ values.purpose }}
##
apiVersion: platform.sharatvikas.io/v1alpha1
kind: S3Bucket
metadata:
  name: ${{ values.environment }}-${{ values.name }}
  namespace: ${{ values.environment }}
  labels:
    environment: ${{ values.environment }}
    owner: ${{ values.owner | replace("/", "-") }}
    managed-by: backstage-idp
  annotations:
    idp.sharatvikas.io/purpose: ${{ values.purpose }}
    idp.sharatvikas.io/provisioned-via: backstage-template-s3
spec:
  versioning: ${{ values.versioning }}
  encryption: ${{ values.encryption }}
  publicAccessBlock: ${{ values.public_access_block }}
  lifecycleEnabled: ${{ values.lifecycle_enabled }}
