##
## Backstage Software Template: RDS PostgreSQL Database
##
## Self-service provisioning of a Crossplane-managed RDS PostgreSQL instance.
## Engineers fill out a form; the template submits a PR to the GitOps repo
## containing a Crossplane RDSInstance claim. ArgoCD syncs it automatically.
##
## What gets created:
##   - Crossplane RDSInstance claim (gitops/crossplane/claims/)
##   - Kubernetes Secret reference (for app to consume DATABASE_URL)
##   - Backstage Resource entity registered in catalog
##
apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: rds-database-template
  title: RDS PostgreSQL Database
  description: >
    Self-service provisioning of a managed PostgreSQL database via Crossplane.
    Fills a PR to the platform GitOps repo — platform team reviews and ArgoCD syncs.
  tags:
    - database
    - aws
    - rds
    - postgresql
    - crossplane
spec:
  owner: platform-team
  type: resource

  parameters:
    - title: Database Details
      required: [name, owner, purpose]
      properties:
        name:
          title: Database Name
          type: string
          description: Logical name (e.g. payments-db, analytics-store). Hyphens ok.
          pattern: "^[a-z][a-z0-9-]{2,40}$"
          ui:autofocus: true
        owner:
          title: Owner Team
          type: string
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              kind: Group
        purpose:
          title: Purpose
          type: string
          description: What application or use case is this database for?

    - title: Configuration
      required: [environment, instance_class]
      properties:
        environment:
          title: Environment
          type: string
          enum: [production, staging, development]
          default: staging
        instance_class:
          title: Instance Class
          type: string
          enum:
            - db.t3.micro
            - db.t3.small
            - db.t3.medium
            - db.r6g.large
            - db.r6g.xlarge
          enumNames:
            - "db.t3.micro (dev/test only)"
            - "db.t3.small (light workloads)"
            - "db.t3.medium (moderate workloads)"
            - "db.r6g.large (production recommended)"
            - "db.r6g.xlarge (high-throughput production)"
          default: db.t3.small
        storage_gb:
          title: Storage (GiB)
          type: integer
          minimum: 20
          maximum: 1000
          default: 100
        multi_az:
          title: Multi-AZ
          type: boolean
          default: false
          description: Enable Multi-AZ for high availability (required for production)
        backup_retention_days:
          title: Backup Retention (days)
          type: integer
          minimum: 1
          maximum: 35
          default: 7
        postgres_version:
          title: PostgreSQL Version
          type: string
          enum: ["15", "16"]
          default: "15"
        deletion_protection:
          title: Deletion Protection
          type: boolean
          default: true

  steps:
    - id: fetch-claim
      name: Render Crossplane Claim
      action: fetch:template
      input:
        url: ./skeleton
        values:
          name: ${{ parameters.name }}
          owner: ${{ parameters.owner }}
          purpose: ${{ parameters.purpose }}
          environment: ${{ parameters.environment }}
          instance_class: ${{ parameters.instance_class }}
          storage_gb: ${{ parameters.storage_gb }}
          multi_az: ${{ parameters.multi_az }}
          backup_retention_days: ${{ parameters.backup_retention_days }}
          postgres_version: ${{ parameters.postgres_version }}
          deletion_protection: ${{ parameters.deletion_protection }}

    - id: open-pr
      name: Open GitOps Pull Request
      action: publish:github:pull-request
      input:
        repoUrl: github.com?repo=platform-engineering-blueprint&owner=sharatvikas
        title: "feat(db): provision RDS ${{ parameters.name }} (${{ parameters.environment }})"
        description: |
          ## Database Provision Request

          **Name:** ${{ parameters.name }}
          **Owner:** ${{ parameters.owner }}
          **Environment:** ${{ parameters.environment }}
          **Instance:** ${{ parameters.instance_class }}
          **Storage:** ${{ parameters.storage_gb }} GiB
          **Multi-AZ:** ${{ parameters.multi_az }}
          **Purpose:** ${{ parameters.purpose }}

          ---
          Auto-generated by Backstage self-service template.
          Approve to allow ArgoCD to sync this resource.
        branchName: db/${{ parameters.name }}-${{ parameters.environment }}
        sourcePath: ./
        targetPath: gitops/crossplane/claims/databases

  output:
    links:
      - title: GitOps Pull Request
        url: ${{ steps.open-pr.output.remoteUrl }}
      - title: View Crossplane Claims
        url: https://github.com/sharatvikas/platform-engineering-blueprint/tree/main/gitops/crossplane/claims/databases
