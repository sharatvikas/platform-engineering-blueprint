##
## Crossplane RDSInstance claim — auto-generated by Backstage IDP
## Owner: ${{ values.owner }}
## Purpose: ${{ values.purpose }}
##
apiVersion: platform.sharatvikas.io/v1alpha1
kind: RDSInstance
metadata:
  name: ${{ values.name }}
  namespace: ${{ values.environment }}
  labels:
    environment: ${{ values.environment }}
    owner: ${{ values.owner | replace("/", "-") }}
    managed-by: backstage-idp
  annotations:
    idp.sharatvikas.io/purpose: ${{ values.purpose }}
    idp.sharatvikas.io/provisioned-via: backstage-template-rds
spec:
  instanceClass: ${{ values.instance_class }}
  engine: postgres
  engineVersion: "${{ values.postgres_version }}"
  storageGib: ${{ values.storage_gb }}
  multiAZ: ${{ values.multi_az }}
  backupRetentionDays: ${{ values.backup_retention_days }}
  deletionProtection: ${{ values.deletion_protection }}
  environment: ${{ values.environment }}
  dbName: ${{ values.name | replace("-", "_") }}
  credentialsSecret: ${{ values.name }}-credentials
