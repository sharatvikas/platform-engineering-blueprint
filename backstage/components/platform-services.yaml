apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: argocd
  title: ArgoCD
  description: GitOps continuous delivery controller managing all application deployments
  annotations:
    backstage.io/source-location: url:https://github.com/sharatvikas/platform-engineering-blueprint/tree/main/gitops
    argocd/app-name: argocd
  tags:
    - gitops
    - cd
    - kubernetes
  links:
    - url: https://argocd.internal/
      title: ArgoCD UI
      icon: dashboard
spec:
  type: service
  lifecycle: production
  owner: platform-team
  system: internal-developer-platform
  providesApis:
    - argocd-api

