##
## Default ProviderConfig — referenced implicitly by every managed resource
## that doesn't set spec.providerConfigRef.
##
## IRSA: the provider pod's service account token is exchanged for AWS
## credentials via the cluster OIDC provider. Requires the STS VPC endpoint
## (terraform/modules/vpc, enable_sts_endpoint) on private-only clusters.
##
apiVersion: aws.upbound.io/v1beta1
kind: ProviderConfig
metadata:
  name: default
  annotations:
    # ProviderConfig CRD arrives with the provider package — sync after it
    argocd.argoproj.io/sync-wave: "5"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  credentials:
    source: IRSA
