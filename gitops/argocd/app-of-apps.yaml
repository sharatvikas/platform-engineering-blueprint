apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    # This is the root App-of-Apps — it manages all other ArgoCD Applications.
    # Changes to this file trigger ArgoCD to reconcile the entire platform.
    argocd.argoproj.io/sync-wave: "-10"
spec:
  # Built-in `default` project — the root app is applied by Terraform at
  # bootstrap, before the `platform` AppProject exists. Child Applications
  # (including platform-projects, which creates the AppProjects) are all
  # scoped to restricted projects.
  project: default
  source:
    repoURL: https://github.com/sharatvikas/platform-engineering-blueprint
    targetRevision: HEAD
    path: gitops/argocd/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
